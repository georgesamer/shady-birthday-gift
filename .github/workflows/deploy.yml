name: Deploy birthday app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Find app directory
        shell: bash
        run: |
          workflow_file="${GITHUB_WORKFLOW_REF%@*}"
          workflow_file="${workflow_file#${GITHUB_REPOSITORY}/}"
          app_dir="$(dirname "$(dirname "$(dirname "$workflow_file")")")"
          if [ ! -f "$app_dir/package.json" ]; then
            echo "Could not find package.json beside the Pages workflow." >&2
            exit 1
          fi
          echo "APP_DIR=$app_dir" >> "$GITHUB_ENV"

      - name: Install dependencies and build
        run: |
          cd "$APP_DIR"
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
